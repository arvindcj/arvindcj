name: Deploy Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: |
          bundle exec jekyll clean
          bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
          GTM_ID: ${{ secrets.GTM_ID }}

      - name: Ensure Cloudflare Pages project exists
        run: ruby scripts/ensure_cfpages.rb
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Wrangler output
        if: always()
        env:
          WRANGLER_STDOUT: ${{ steps.deploy.outputs.command-output }}
          WRANGLER_STDERR: ${{ steps.deploy.outputs.command-stderr }}
        run: |
          if [ -n "$WRANGLER_STDOUT" ]; then
            echo "$WRANGLER_STDOUT"
          fi

          if [ -n "$WRANGLER_STDERR" ]; then
            echo "$WRANGLER_STDERR"
          fi
